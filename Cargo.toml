[package]
name = "omni_launcher"
version = "3.0.0"
edition = "2024"
description = "Lanceur de jeux léger pour Windows"
build = "build.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
ureq = { version = "3", default-features = false, features = ["rustls"] }
walkdir = "2"

# Uniquement pour compiler/tester l'interface sous Linux.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
